<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>智慧空间 - 丝滑融合版</title>
    <style>
        /* 0. 空间基调 */
        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* 开启硬件加速基底 */
            transform: translateZ(0);
        }

        /* 1. 意识载体 (The Vessel) */
        .consciousness-vessel {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 使用 GPU 友好的 transform 动画 */
            animation: 
                drift-x 6s ease-in-out infinite alternate, 
                drift-y 4s ease-in-out infinite alternate;
            will-change: transform;
        }

        /* 2. 背景轨道 (The Rail) */
        .rail {
            position: absolute;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            /* 使用简单的渐变替代昂贵的 mask 动画 */
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.2) 70%, transparent 100%);
        }

        /* 3. 意识核心 (The Head) */
        .head {
            position: relative;
            width: 10px; 
            height: 10px; 
            background-color: #fff; /* 纯白核心 */
            border-radius: 50%;
            z-index: 10; /* 关键：在拖尾之上 */
            
            /* 
               光晕优化：
               使用静态的强大光晕，通过 scale 动画模拟呼吸，
               避免频繁重绘 box-shadow 属性。
            */
            box-shadow: 0 0 15px 5px rgba(255, 255, 255, 0.4);
            animation: pulse-scale 3s ease-in-out infinite alternate;
            will-change: transform;
        }

        /* 4. 融合拖尾 (The Seamless Trail) */
        .trail {
            position: absolute;
            right: 50%; /* 从中心开始 */
            
            /* 
               尺寸调整：
               高度设为 6px (略小于球体 10px)，
               这样插入球体时会被球体完美包裹，不会露边。
            */
            height: 6px; 
            width: 140px; 

            /* 
               位置调整（关键）：
               向右偏移 6px (margin-right)，
               这意味着它实际上插进了球体中心，
               从视觉上完全消除了缝隙。
            */
            margin-right: -5px; 

            /* 
               颜色融合优化：
               起始颜色必须是 #FFF (不透明纯白)，
               这样才能和球体无缝融合。
               向左渐变到透明。
            */
            background: linear-gradient(to left, #fff 10%, rgba(255,255,255,0) 100%);
            
            /* 
               柔光模拟：
               不用 filter:blur (太卡)。
               改用 box-shadow 制造柔边。
            */
            box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.2);
            
            border-radius: 100px; /* 圆润头部 */
            z-index: 5; /* 在球体之下 */

            transform-origin: right center; /* 以连接处为轴摆动 */
            
            animation: tail-sway 3s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }

        /* === 动画剧本 === */

        @keyframes drift-x {
            from { transform: translateX(-25px); }
            to   { transform: translateX(25px); }
        }

        @keyframes drift-y {
            from { transform: translateY(-4px); }
            to   { transform: translateY(4px); }
        }

        /* 
           缩放呼吸：
           比改变 shadow 性能更好，且视觉上一样。
        */
        @keyframes pulse-scale {
            0%   { transform: scale(0.95); opacity: 0.9; }
            100% { transform: scale(1.05); opacity: 1.0; }
        }

        /* 
           尾部摆动：
           只用 transform (GPU加速)，不触发布局重排。
        */
        @keyframes tail-sway {
            0% {
                transform: rotate(1.5deg) scaleX(0.95);
                opacity: 0.7;
            }
            100% {
                transform: rotate(-1.5deg) scaleX(1.05);
                opacity: 0.9;
            }
        }

    </style>
</head>
<body>

    <div class="consciousness-vessel">
        <div class="rail"></div>
        <!-- 注意：拖尾在球体下层 -->
        <div class="trail"></div>
        <div class="head"></div>
    </div>

</body>
</html>
