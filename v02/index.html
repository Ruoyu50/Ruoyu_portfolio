<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>智慧空间 - 最终纯净版</title>
    <style>
        /* 
           0. 空间基调 
           绝对的黑，去除一切干扰。
        */
        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 
           1. 意识载体 (The Vessel)
           这是光点和拖尾的统合体。
           我们给它一个复合的“漂流”动画：
           左右漂移 + 极微小的上下浮动 = 有机生命感
        */
        .consciousness-vessel {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: 
                drift-x 6s ease-in-out infinite alternate, /* 左右慢漂 */
                drift-y 4s ease-in-out infinite alternate; /* 上下微浮 */
        }

        /* 
           2. 智慧轨道 (The Rail) 
           它是一根甚至不需要被完全看清的弦。
           我们把它做得更细、更淡，让它仅仅作为一种“方向”的暗示。
        */
        .rail {
            position: absolute;
            width: 100%;
            height: 1px; /* 极细 */
            background: #fff;
            opacity: 0.15; /* 非常克制，不抢眼 */
            /* 两端柔和消失 */
            mask-image: linear-gradient(to right, transparent, black 40%, black 60%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 40%, black 60%, transparent);
        }

        /* 
           3. 意识核心 (The Core)
           这是绝对的“我”。
        */
        .head {
            position: relative;
            width: 8px; /* 小而精 */
            height: 8px;
            background-color: #fff; /* 实体白 */
            border-radius: 50%;
            z-index: 10;
            
            /* 
               光晕动画：
               这里的 box-shadow 是核心的灵魂。
               我们不只是画一个光圈，而是让光圈在呼吸。
            */
            animation: pulse-glow 3s infinite alternate; 
        }

        /* 
           4. 光流拖尾 (The Flow Trail)
           这部分最难拿捏。
           为了让它不像“一根棍子”，我们把高度设为 1px (和轨道一样)，
           然后用 box-shadow 来制造“光雾”感，而不是用 background 填充。
           这样它更像是一束光，而不是一个物体。
        */
        .trail {
            position: absolute;
            right: 50%; /* 从中心向左延伸 */
            width: 180px; /* 稍微长一点，更显从容 */
            height: 1px; /* 只有1像素高，像一根激光 */
            
            /* 
               这里不用 background-color，
               而是用渐变背景，模拟光束核心。
            */
            background: linear-gradient(to left, rgba(255,255,255,1), transparent);
            
            /* 
               外发光：
               这是拖尾的“体量感”。
               让它周围有一层淡淡的白雾。
            */
            box-shadow: 0 0 8px 1px rgba(255, 255, 255, 0.4);
            
            /* 连接处的微调，稍微向右推一点点，插入球体内部，消除缝隙 */
            margin-right: 4px;
            
            /* 边缘柔化 */
            border-radius: 100px;
            
            /* 
               拖尾动画：
               模拟能量的不稳定性。
               长度和亮度会微微闪烁。
            */
            animation: tail-shimmer 2s ease-in-out infinite alternate;
            
            /* 稍微改变旋转中心，让它跟随球体 */
            transform-origin: right center;
        }

        /* 
           === 动画剧本 (The Soul Scripts) === 
        */

        /* X轴漂移：从容、缓慢 */
        @keyframes drift-x {
            from { transform: translateX(-20px); }
            to   { transform: translateX(20px); }
        }

        /* Y轴微动：像悬浮在水里 */
        @keyframes drift-y {
            from { transform: translateY(-2px); }
            to   { transform: translateY(2px); }
        }

        /* 光晕呼吸：模拟生命体征 */
        @keyframes pulse-glow {
            0% {
                /* 稍微暗一点，收敛 */
                box-shadow: 0 0 10px 1px rgba(255, 255, 255, 0.5);
                transform: scale(0.95);
            }
            100% {
                /* 稍微亮一点，扩张 */
                box-shadow: 0 0 20px 4px rgba(255, 255, 255, 0.8);
                transform: scale(1.05);
            }
        }

        /* 拖尾流光：模拟光流的不稳定性 */
        @keyframes tail-shimmer {
            0% {
                opacity: 0.7;
                width: 160px; /* 缩短 */
            }
            100% {
                opacity: 1.0;
                width: 200px; /* 拉长 */
            }
        }

    </style>
</head>
<body>

    <!-- 容器：承载整个生命体 -->
    <div class="consciousness-vessel">
        
        <!-- 背景弦 -->
        <div class="rail"></div>
        
        <!-- 拖尾：光的余韵 -->
        <div class="trail"></div>
        
        <!-- 核心：意识主体 -->
        <div class="head"></div>
        
    </div>

</body>
</html>
