<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>智慧空间 - 无暇版</title>
    <style>
        /* 0. 空间基调 */
        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transform: translateZ(0); /* 开启硬件加速 */
        }

        /* 1. 意识载体 */
        .consciousness-vessel {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: 
                drift-x 6s ease-in-out infinite alternate, 
                drift-y 4s ease-in-out infinite alternate;
            will-change: transform;
        }

        /* 2. 背景轨道 */
        .rail {
            position: absolute;
            width: 100%;
            height: 1px;
            /* 降低不透明度，让它更隐蔽 */
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.1) 30%, rgba(255,255,255,0.1) 70%, transparent 100%);
        }

        /* 3. 意识核心 */
        .head {
            position: relative;
            width: 10px; 
            height: 10px; 
            background-color: #fff;
            border-radius: 50%;
            z-index: 10;
            
            /* 核心光晕 */
            box-shadow: 0 0 15px 4px rgba(255, 255, 255, 0.5);
            animation: pulse-scale 3s ease-in-out infinite alternate;
            will-change: transform;
        }

        /* 4. 融合拖尾 (The Flawless Trail) */
        .trail {
            position: absolute;
            right: 50%; 
            height: 6px; 
            width: 140px; 
            margin-right: -5px; /* 插入球体 */

            /* 
               【关键修复 1】：颜色逻辑
               不要渐变到 transparent (透明)，那样容易发灰。
               要渐变到 black (纯黑)，在混合模式下黑即是无。
               但因为我们用了 mask，这里保持纯白到透明即可，交给 mask 去切。
            */
            background: linear-gradient(to left, #fff 20%, rgba(255,255,255,0) 100%);
            
            /* 
               【关键修复 2】：光晕逻辑
               不再给左边留影子。
            */
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.3);
            
            border-radius: 100px; 
            z-index: 5; 
            transform-origin: right center; 
            
            /* 
               【核心大招】：CSS 遮罩 (Mask)
               这是消除“破绽”的终极手段。
               它像一个滤网，强制把拖尾的左侧（尾部）给“抹除”掉。
               to right: 从左(0%)到右(100%)
               transparent(看不见) -> black(看得见)
               这样，尾部最左端的那个 vertex 光圈会被直接切掉，不再闭合。
            */
            mask-image: linear-gradient(to right, transparent 0%, black 40%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 40%);

            animation: tail-sway 3s ease-in-out infinite alternate;
            will-change: transform, opacity;
        }

        /* === 动画 === */

        @keyframes drift-x {
            from { transform: translateX(-25px); }
            to   { transform: translateX(25px); }
        }

        @keyframes drift-y {
            from { transform: translateY(-4px); }
            to   { transform: translateY(4px); }
        }

        @keyframes pulse-scale {
            0%   { transform: scale(0.95); opacity: 0.9; }
            100% { transform: scale(1.05); opacity: 1.0; }
        }

        @keyframes tail-sway {
            0% {
                transform: rotate(1.5deg) scaleX(0.95);
                opacity: 0.8;
            }
            100% {
                transform: rotate(-1.5deg) scaleX(1.05);
                opacity: 1.0;
            }
        }

    </style>
</head>
<body>

    <div class="consciousness-vessel">
        <div class="rail"></div>
        <div class="trail"></div>
        <div class="head"></div>
    </div>

</body>
</html>
