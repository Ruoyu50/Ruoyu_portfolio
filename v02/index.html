<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>纯CSS意识流</title>
    <style>
        /* 1. 舞台设置 */
        body {
            margin: 0;
            height: 100vh;
            background-color: #000; /* 深空黑 */
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            overflow: hidden;
        }

        /* 2. 容器：用来统一控制整体的呼吸运动 */
        .consciousness-container {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 呼吸动画：让整个光点在轨道上微动 */
            animation: breathe 4s ease-in-out infinite alternate;
        }

        /* 3. 轨道线 (The Line) */
        .line {
            position: absolute;
            width: 100%; /* 贯穿屏幕 */
            height: 2px; /* 线的粗细 */
            background: #fff; /* 纯白 */
            
            /* 模拟 Fog (迷雾) 效果：
               使用渐变遮罩，让线在左右两端变透明，中间实心。
               无需复杂的 3D 计算，这就是一张简单的渐变图。 */
            mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
            
            opacity: 0.5; /* 稍微淡一点，不要抢了光点的戏 */
        }

        /* 4. 意识光点 (The Ball) */
        .ball {
            position: relative; /* 相对容器居中 */
            width: 12px;  /* 核心大小 */
            height: 12px;
            background-color: #fff; /* 纯白实心核心 */
            border-radius: 50%; /* 变成圆 */
            z-index: 10; /* 保证在最上层 */
            
            /* 光晕效果：利用 box-shadow 制造发光感 */
            /* 参数：x偏移 y偏移 模糊半径 扩展半径 颜色 */
            box-shadow: 
                0 0 10px 2px rgba(255, 255, 255, 0.8), /* 内层强光 */
                0 0 30px 10px rgba(255, 255, 255, 0.2); /* 外层柔光 */
        }

        /* 5. 动画定义：呼吸微动 */
        @keyframes breathe {
            from { transform: translateX(-20px); } /* 向左漂 */
            to   { transform: translateX(20px); }  /* 向右漂 */
        }

        /* UI 文字 (仅作提示) */
        .ui {
            position: absolute;
            bottom: 40px;
            color: #444;
            font-family: sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- 整个意识体 -->
    <div class="consciousness-container">
        <!-- 轨道 -->
        <div class="line"></div>
        <!-- 光点 -->
        <div class="ball"></div>
    </div>

    <div class="ui">纯 CSS 实现 · 零 JS</div>

</body>
</html>
