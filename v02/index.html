<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>轨道意识 - The Track</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-family: sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui">
    [ 意识锚定于线 ]<br>
    自然微动 · 鼠标向右：加速结合流
</div>

<!-- 引入 Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // --- 场景初始化 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000); // 纯黑
    // 添加一点极其微弱的雾，让线的两端柔和消失
    scene.fog = new THREE.Fog(0x000000, 10, 40);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- 1. 轨道 (The White Line / Track) ---
    // 这是一根贯穿屏幕的长线
    const railLength = 100;
    const railThickness = 0.12; // 线的粗细 (类似心电图基线)
    
    const railGeo = new THREE.PlaneGeometry(railLength, railThickness);
    const railMat = new THREE.MeshBasicMaterial({ 
        color: 0x444444, // 轨道本身是暗淡的灰白色，不抢戏
        transparent: true,
        opacity: 0.5,
        side: THREE.DoubleSide
    });
    const rail = new THREE.Mesh(railGeo, railMat);
    scene.add(rail);

    // --- 2. 意识光点 (The Consciousness Point) ---
    // 一个附着在线上的发光球体
    const headGroup = new THREE.Group(); // 用于整体控制光点和拖尾
    scene.add(headGroup);

    // 实体核心
    const coreGeo = new THREE.SphereGeometry(0.15, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const core = new THREE.Mesh(coreGeo, coreMat);
    headGroup.add(core);

    // 辉光 (Glow Sprite)
    const txLoader = new THREE.TextureLoader();
    const cvs = document.createElement('canvas');
    cvs.width = 64; cvs.height = 64;
    const ctx = cvs.getContext('2d');
    const grd = ctx.createRadialGradient(32,32,0, 32,32,32);
    grd.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grd.addColorStop(0.3, 'rgba(200, 240, 255, 0.3)');
    grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,64,64);
    const glowMat = new THREE.SpriteMaterial({ 
        map: new THREE.CanvasTexture(cvs), 
        color: 0xffffff, 
        blending: THREE.AdditiveBlending,
        opacity: 0.8
    });
    const glow = new THREE.Sprite(glowMat);
    glow.scale.set(4, 4, 1);
    headGroup.add(glow);

    // --- 3. 拖尾 (The Comet Trail ON THE LINE) ---
    // 这个拖尾必须看起来像是覆盖在轨道上的高亮区域
    const trailLength = 12;
    const trailGeo = new THREE.PlaneGeometry(trailLength, railThickness * 1.5); // 比轨道稍微宽一点点，产生光晕感
    // 几何体偏移，让原点在右侧，尾巴向左延伸
    trailGeo.translate(-trailLength / 2, 0, 0.01); // z=0.01 防止与轨道重叠闪烁

    // 拖尾着色器：头部亮，尾部渐隐，中间有流动的噪波
    const trailUniforms = {
        uTime: { value: 0 },
        uSpeed: { value: 0 }
    };
    
    const trailMat = new THREE.ShaderMaterial({
        uniforms: trailUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform float uSpeed;
            varying vec2 vUv;

            void main() {
                // vUv.x 从 0(左/尾) 到 1(右/头)
                
                // 1. 基础渐变：越靠近头越亮
                float strength = smoothstep(0.0, 1.0, vUv.x);
                // 指数级衰减，让尾巴更长更柔和
                strength = pow(strength, 3.0); 

                // 2. 流动纹理 (Flow)
                // 模拟光子向后流动的视觉残留
                // 速度越快，纹理拉得越长
                float flow = sin(vUv.x * 20.0 + uTime * 5.0) * 0.5 + 0.5;
                // 混合：头部主要靠纯白，尾部才显现出流动的纹理
                float alpha = strength * mix(0.5 + 0.5 * flow, 1.0, vUv.x);

                // 3. 边缘柔化 (上下边缘)
                float beam = 1.0 - abs(vUv.y - 0.5) * 2.0;
                beam = smoothstep(0.0, 0.5, beam);

                gl_FragColor = vec4(1.0, 1.0, 1.0, alpha * beam);
            }
        `
    });

    const trail = new THREE.Mesh(trailGeo, trailMat);
    headGroup.add(trail); // 将拖尾绑定到头部组，跟随移动


    // --- 4. 动画逻辑 ---
    let time = 0;
    let speed = 0; // 虚拟流速
    
    // 模拟呼吸般的前后微动参数
    let driftOffset = 0;
    
    // 鼠标交互
    let mouseX = 0;
    document.addEventListener('mousemove', (e) => {
        // 归一化 0 ~ 1
        mouseX = e.clientX / window.innerWidth;
    });

    function animate() {
        requestAnimationFrame(animate);
        time += 0.01;

        // 1. 计算结合状态 (鼠标越右，结合越深)
        // 结合越深 = 虚拟流速越快 + 拖尾越明显 + 光点越稳定
        let targetSpeed = 0.5; // 基础流速
        if (mouseX > 0.5) {
            targetSpeed += (mouseX - 0.5) * 8.0; // 加速
        }
        speed += (targetSpeed - speed) * 0.05; // 缓动

        // 2. 模拟“不完全匀速”的微动 (The Micro-movements)
        // 这是一个叠加的正弦波，模拟漂浮感
        // 当结合度高(速度快)时，抖动会变小，变得更专注
        let driftIntensity = (1.0 - Math.min(speed / 4, 0.8)) * 0.8; 
        
        // Perlin-like 随机漂移
        let drift = Math.sin(time * 0.8) * 0.5 + Math.sin(time * 2.3) * 0.2;
        driftOffset = drift * driftIntensity;

        // 更新位置：
        // 光点始终在轨道上 (y=0, z=0)
        // x 轴根据漂移在中心附近摆动
        headGroup.position.x = driftOffset;

        // 3. 更新拖尾效果
        // 传递时间，模拟光流向后退
        trailMat.uniforms.uTime.value = time * speed; 
        
        // 轨道微动：为了增加相对运动的错觉，我们可以让轨道纹理(如果有的话)反向移动
        // 这里简单处理：让摄像机极微小地跟随光点，产生视差
        camera.position.x = driftOffset * 0.2;

        renderer.render(scene, camera);
    }

    // 窗口适配
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();

</script>
</body>
</html>
