<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>智慧空间 - 灵动残影版</title>
    <style>
        /* 0. 空间基调 */
        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 1. 意识载体 (The Vessel) */
        .consciousness-vessel {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 复合漂流：给整体一个基础的游动感 */
            animation: 
                drift-x 6s ease-in-out infinite alternate, 
                drift-y 4s ease-in-out infinite alternate;
        }

        /* 2. 背景智慧弦 (The Rail) - 保持不变，作为静谧的参考 */
        .rail {
            position: absolute;
            width: 100%;
            height: 1px;
            background: #fff;
            opacity: 0.15;
            mask-image: linear-gradient(to right, transparent, black 40%, black 60%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 40%, black 60%, transparent);
        }

        /* 3. 意识核心 (The Head) */
        .head {
            position: relative;
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            z-index: 10;
            /* 光晕呼吸 */
            animation: pulse-glow 3s infinite alternate; 
        }

        /* 
           4. 【核心修改】光球残影 (The Afterimage Trail)
           不再是一根线，而是一束“被拉长、被模糊的光”。
        */
        .trail {
            position: absolute;
            right: 50%; /* 锚点在中心 */
            
            /* 
               修改点 A: 
               宽度稍微缩短一点，让它更聚气。
               高度设为 6px (接近球体大小)，而不再是 1px。
               这样它就有“体积”了。
            */
            width: 120px; 
            height: 6px; 
            
            /* 
               修改点 B: 
               利用 mask-image 制造“拖尾变细”的效果。
               虽然它是矩形，但我们在遮罩上把它切成类似水滴的形状。
            */
            background: rgba(255, 255, 255, 0.6);
            
            /* 
               修改点 C: 
               高斯模糊 (Blur)。
               这是产生“残影感”的关键。
               它模糊了边缘，让它看起来像是一团移动得很快的光雾。
            */
            filter: blur(3px);
            
            /* 稍微向右偏移，插入球体光晕中，无缝衔接 */
            margin-right: 2px;
            
            /* 设置旋转中心在最右侧（靠近球头的位置） */
            transform-origin: right center;

            /* 
               修改点 D: 
               添加“摆动”动画 (tail-sway)。
               让尾巴不仅仅是跟着跑，还会上下微微摆动，
               打破“直线”的僵硬感。
            */
            animation: 
                trail-fade 2s ease-in-out infinite alternate, /* 忽明忽暗 */
                tail-sway 3s ease-in-out infinite alternate;  /* 上下摆动 */
        }

        /* === 动画剧本 === */

        @keyframes drift-x {
            from { transform: translateX(-20px); }
            to   { transform: translateX(20px); }
        }

        @keyframes drift-y {
            from { transform: translateY(-3px); }
            to   { transform: translateY(3px); }
        }

        @keyframes pulse-glow {
            0% {
                box-shadow: 0 0 10px 1px rgba(255, 255, 255, 0.4);
                transform: scale(0.95);
            }
            100% {
                box-shadow: 0 0 20px 4px rgba(255, 255, 255, 0.7);
                transform: scale(1.05);
            }
        }

        /* 
           新动画：尾部摆动 
           这会让直线的拖尾产生一种“S型”的错觉，
           看起来像是在水流中飘动的丝带。
        */
        @keyframes tail-sway {
            0% {
                transform: rotate(2deg) scaleX(0.9);
                opacity: 0.5;
            }
            100% {
                transform: rotate(-2deg) scaleX(1.1);
                opacity: 0.8;
            }
        }
        
        /* 
           新动画：残影渐隐
           模拟能量的不稳定流逝
        */
        @keyframes trail-fade {
            0% { 
                /* 稍微透明，并且让mask遮罩更狠一点，尾巴变短 */
                mask-image: linear-gradient(to left, black 20%, transparent 80%);
                -webkit-mask-image: linear-gradient(to left, black 20%, transparent 80%);
            }
            100% { 
                /* 稍微实一点，尾巴变长 */
                mask-image: linear-gradient(to left, black 40%, transparent 100%);
                -webkit-mask-image: linear-gradient(to left, black 40%, transparent 100%);
            }
        }

    </style>
</head>
<body>

    <div class="consciousness-vessel">
        <!-- 轨道 -->
        <div class="rail"></div>
        
        <!-- 残影：注意它的顺序在球后面 -->
        <div class="trail"></div>
        
        <!-- 核心 -->
        <div class="head"></div>
    </div>

</body>
</html>
