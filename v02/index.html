<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>意识光流 - 彗星常态</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #ui {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Arial', sans-serif;
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui">
    [ 意识常态 ] <br>
    当前：稳定流速 · 鼠标向右：加速结合
</div>

<!-- 引入 Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // --- 1. 场景基础 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000); // 纯黑深空

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 20); // 相机距离适中

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // --- 2. 核心：彗星头 (The Head) ---
    // 这是你的意识焦点，永远保持清晰
    const headGeo = new THREE.SphereGeometry(0.15, 32, 32); // 核心很小，像针尖
    const headMat = new THREE.MeshBasicMaterial({ 
        color: 0xffffff,
        transparent: true,
        opacity: 1.0 
    });
    const head = new THREE.Mesh(headGeo, headMat);
    scene.add(head);

    // 给头加一个大的辉光 (Glow Sprite)
    const textureLoader = new THREE.TextureLoader();
    const canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    // 绘制一个柔和的亮斑
    const grd = ctx.createRadialGradient(64,64,0, 64,64,64);
    grd.addColorStop(0, 'rgba(255, 255, 255, 1)');     // 核心白
    grd.addColorStop(0.2, 'rgba(200, 230, 255, 0.4)'); // 外圈微蓝
    grd.addColorStop(0.5, 'rgba(100, 150, 255, 0.1)'); // 边缘淡化
    grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,128,128);
    
    const spriteMap = new THREE.CanvasTexture(canvas);
    const spriteMat = new THREE.SpriteMaterial({ 
        map: spriteMap, 
        color: 0xffffff, 
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.8
    });
    const glowSprite = new THREE.Sprite(spriteMat);
    glowSprite.scale.set(3, 3, 1); // 辉光大小
    head.add(glowSprite);


    // --- 3. 核心：光流拖尾 (The Comet Tail / Track) ---
    // 这是一个长条形的平面，位于头部的左侧
    // 我们用 ShaderMaterial 来控制它的样子，保证它绝对平滑、不散架
    
    const tailLength = 15; // 拖尾长度
    const tailGeo = new THREE.PlaneGeometry(tailLength, 2, 64, 1); // 宽15，高2 (用于辉光空间)
    // 将几何体向左平移，使得原点(0,0)在平面的右端（连接头部）
    tailGeo.translate(-tailLength / 2, 0, 0);

    // 自定义着色器
    const tailUniforms = {
        uTime: { value: 0 },
        uSpeed: { value: 1.0 }, // 流动速度
        uColor: { value: new THREE.Color(0xffffff) },
        uThickness: { value: 0.08 } // 线条核心厚度 (0.05 - 0.1 比较像粗一点的心电图线)
    };

    const tailMat = new THREE.ShaderMaterial({
        uniforms: tailUniforms,
        transparent: true,
        blending: THREE.AdditiveBlending, // 叠加发光模式
        depthWrite: false,
        vertexShader: `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `,
        fragmentShader: `
            uniform float uTime;
            uniform float uSpeed;
            uniform float uThickness;
            uniform vec3 uColor;
            varying vec2 vUv;

            // 简单的伪随机函数
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }

            void main() {
                // vUv.x: 0 (左侧/尾巴) -> 1 (右侧/头部)
                // vUv.y: 0 (下) -> 1 (上)

                // 1. 核心线条形状 (The Line Shape)
                // 使用 smoothstep 做一个软边缘的线，保持中间最亮
                float distFromCenter = abs(vUv.y - 0.5);
                // 线的强度：距离中心越近越亮
                float lineIntensity = 1.0 - smoothstep(0.0, uThickness, distFromCenter);
                
                // 2. 拖尾渐变 (Fade Out)
                // 越往左(x接近0)越透明，越往右(x接近1)越亮
                float fade = smoothstep(0.0, 0.4, vUv.x); // 尾部渐隐
                
                // 3. 流动纹理 (The Flow)
                // 我们让噪波从右向左跑 (vUv.x + time)
                // 这是一个单纯的视觉纹理，让线看起来在“动”
                float flowX = vUv.x * 10.0 + uTime * uSpeed * 5.0;
                float noise = sin(flowX) * 0.5 + 0.5; // 0到1的正弦波
                noise = mix(0.7, 1.0, noise); // 让波动不要太剧烈，保持在0.7-1.0之间亮度变化

                // 4. 结合所有因子
                float alpha = lineIntensity * fade * noise;
                
                // 增加一点辉光宽度的微弱光晕
                float glow = (1.0 - smoothstep(0.0, 0.5, distFromCenter)) * 0.2 * fade;
                
                gl_FragColor = vec4(uColor, alpha + glow);
            }
        `
    });

    const tail = new THREE.Mesh(tailGeo, tailMat);
    scene.add(tail);

    // --- 4. 交互与动画 ---
    let time = 0;
    let targetSpeed = 0.5; // 基础流速
    let currentSpeed = 0.5;
    
    // 鼠标交互只控制“流速感”，不改变位置
    // 鼠标越往右，感觉飞得越快
    document.addEventListener('mousemove', (e) => {
        let x = (e.clientX / window.innerWidth); // 0 到 1
        // x=0.5是常态，x>0.5加速
        if (x > 0.5) {
            targetSpeed = 0.5 + (x - 0.5) * 4.0; // 最大速度增加
        } else {
            targetSpeed = 0.5; // 保持基础速度
        }
    });

    function animate() {
        requestAnimationFrame(animate);
        
        // 平滑速度变化
        currentSpeed += (targetSpeed - currentSpeed) * 0.05;
        
        // 更新 Shader 时间变量
        time += 0.01;
        tailMat.uniforms.uTime.value = time;
        tailMat.uniforms.uSpeed.value = currentSpeed;

        // 微妙的呼吸感 (Head Breathing)
        // 意识点不是死的，它在轻轻呼吸
        let breathe = 1.0 + Math.sin(time * 2) * 0.05;
        glowSprite.scale.set(3 * breathe, 3 * breathe, 1);

        // 头部微动 (Micro-movement)
        // 模拟手持摄像机或意识的轻微浮动，非常微小
        head.position.y = Math.sin(time * 0.5) * 0.05;
        tail.position.y = head.position.y; // 尾巴紧紧跟随头部

        renderer.render(scene, camera);
    }

    // 窗口适配
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();

</script>
</body>
</html>
